<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naturaleza Encendida · Alojamientos colaboradores</title>
<meta name="description" content="20 % de descuento en la entrada Premium para huéspedes de alojamientos colaboradores. Sevilla y Córdoba.">
<link rel="icon" href="https://www.naturalezaencendida.com/wp-content/uploads/2025/08/cropped-favicon_NE_Black_441fb36a74-270x270.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Jost: alternativa libre a Futura PT (la tipografía de naturalezaencendida.com). Si la landing se aloja en su web, se puede cambiar por "Futura PT". -->
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000;
  --ink:#222220;          /* fondo general de su web */
  --ink-2:#2c2c29;
  --red:#B20000;          /* Sevilla · Carmen */
  --red-d:#730202;
  --purple:#3B0870;       /* Córdoba · Navegantes */
  --purple-d:#23003E;
  --yellow:#FFD702;       /* botones de su web */
  --white:#fff;
  --muted:rgba(255,255,255,.78);
  --line:rgba(255,255,255,.14);
  --font:"Futura PT","Jost","Noto Sans SC","Noto Sans JP","PingFang SC","Hiragino Sans","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--white);font-family:var(--font);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,video{display:block;max-width:100%}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-weight:800;line-height:1.12}
h2{font-size:clamp(1.6rem,4.6vw,2.1rem);text-transform:uppercase;text-align:center;margin-bottom:10px}
.spaced{letter-spacing:.32em;text-transform:uppercase;font-weight:600}
.eyebrow{display:block;text-align:center;font-size:.8rem;color:var(--yellow);margin-bottom:10px}
.sub{color:var(--muted);text-align:center;max-width:620px;margin:0 auto 34px}
section{padding:68px 0}

/* ---------- Header ---------- */
header.top{position:sticky;top:0;z-index:30;background:var(--black)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;height:62px}
.logo img{height:30px;width:auto}
.logo .txt{display:none;font-weight:800;line-height:.95;font-size:.95rem;text-transform:uppercase}
.lang{position:relative}
.lang select{
  appearance:none;-webkit-appearance:none;background:transparent;color:var(--white);
  border:1px solid var(--line);border-radius:50px;padding:8px 34px 8px 14px;
  font:600 .9rem var(--font);cursor:pointer;
}
.lang select option{color:#000}
.lang::after{content:"▾";position:absolute;right:13px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:.8rem}
.bar{background:var(--red);text-align:center;font-size:.85rem;font-weight:600;padding:8px 16px;text-transform:uppercase;letter-spacing:.04em}

/* ---------- Hero ---------- */
.hero{position:relative;min-height:78svh;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;isolation:isolate;background:#050505 url("https://www.naturalezaencendida.com/wp-content/uploads/2026/05/6-768x486.png") center/cover no-repeat}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to bottom,rgba(0,0,0,.35),rgba(0,0,0,.55) 60%,var(--ink))}
.hero .wrap{padding-top:56px;padding-bottom:56px}
.hero .kicker{font-size:.82rem;margin-bottom:18px;display:block}
.hero h1{font-size:clamp(2.1rem,7vw,4rem);text-transform:uppercase;max-width:16ch;margin:0 auto;text-shadow:0 2px 24px rgba(0,0,0,.5)}
.hero p{font-size:clamp(1.02rem,2.4vw,1.2rem);max-width:560px;margin:18px auto 30px;color:var(--white);text-shadow:0 1px 12px rgba(0,0,0,.6)}
.ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;gap:8px;border-radius:50px;padding:13px 26px;font:700 .95rem var(--font);text-decoration:none;cursor:pointer;border:2px solid transparent;transition:transform .15s,filter .15s;text-transform:uppercase;letter-spacing:.02em}
.btn:active{transform:scale(.97)}
.btn.y{background:var(--yellow);color:#000}
.btn.y:hover{filter:brightness(1.06)}
.btn.o{background:transparent;color:var(--white);border-color:var(--white)}
.btn.o:hover{background:rgba(255,255,255,.1)}

/* ---------- Tipos de entrada (estilo de su web) ---------- */
.tickets{background:linear-gradient(var(--red),var(--red-d))}
.tgrid{display:grid;gap:18px;grid-template-columns:1fr;max-width:460px;margin:0 auto}
.tcard{position:relative;background:rgba(0,0,0,.22);border-radius:20px;padding:30px 24px 26px}
.tcard.prem{background:rgba(0,0,0,.38);outline:2px solid var(--yellow)}
.pill{display:inline-block;background:var(--yellow);color:#000;font-weight:700;font-size:.85rem;padding:6px 16px;border-radius:50px;margin-bottom:18px}
.tcard ul{list-style:none;display:grid;gap:10px}
.tcard li{display:flex;gap:10px;align-items:flex-start}
.tcard li b{color:var(--yellow);font-size:1.1rem;line-height:1.3}
.tcard li.no{opacity:.6}
.tcard li.no b{color:var(--white)}
.badge{position:absolute;top:-14px;right:18px;background:var(--white);color:var(--red-d);font-weight:800;font-size:.78rem;text-transform:uppercase;padding:6px 12px;border-radius:50px;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:calc(100% - 36px)}

/* ---------- Cómo funciona ---------- */
.steps{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.step{background:var(--ink-2);border-radius:20px;padding:26px 22px;text-align:center}
.step .n{width:46px;height:46px;border-radius:50%;background:var(--yellow);color:#000;font-weight:800;font-size:1.2rem;display:grid;place-items:center;margin:0 auto 14px}
.step h3{font-size:1.15rem;text-transform:uppercase;margin-bottom:6px}
.step p{color:var(--muted);font-size:.96rem}
.tip{margin:26px auto 0;text-align:center;color:var(--muted);font-size:.95rem;max-width:600px}
.tip span{color:var(--yellow)}

/* ---------- Ciudades ---------- */
.cities .grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.city{border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.city.sev{background:linear-gradient(var(--red),var(--red-d))}
.city.cor{background:linear-gradient(var(--purple),var(--purple-d))}
.city .media{aspect-ratio:16/10;background:#111;overflow:hidden}
.city .media img,.city .media video{width:100%;height:100%;object-fit:cover}
.city .body{padding:24px 22px 26px;display:flex;flex-direction:column;gap:8px;flex:1}
.city .where{font-size:.78rem}
.city h3{font-size:1.9rem;text-transform:uppercase}
.city .venue{font-weight:600}
.city .dates{color:var(--yellow);font-weight:600}
.city p.desc{color:var(--muted);font-size:.96rem;flex:1}
.city .dur{font-size:.88rem;color:var(--muted)}
.city .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.city .btns .btn{flex:1 1 auto;padding:12px 18px;font-size:.86rem}

/* ---------- Cómo comprar ---------- */
.buysteps{list-style:none;counter-reset:b;display:grid;gap:12px;max-width:760px;margin:30px auto 0}
.buysteps li{counter-increment:b;display:flex;gap:16px;align-items:flex-start;background:var(--ink-2);border-radius:18px;padding:18px 20px}
.buysteps li::before{content:counter(b);flex:0 0 38px;height:38px;border-radius:50%;background:var(--yellow);color:#000;font-weight:800;display:grid;place-items:center}
.buysteps li.key{outline:2px solid var(--yellow)}
.buysteps li span{padding-top:6px}
.city .price{font-weight:700;font-size:1.05rem}
.city .price s{opacity:.6;font-weight:500;margin-right:4px}
.city .gift{font-size:.9rem;color:var(--muted)}

/* ---------- Experiencia ---------- */
.features{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-bottom:28px}
.feature{background:var(--ink-2);border-radius:20px;padding:24px 22px}
.feature .ic{font-size:1.6rem;margin-bottom:10px}
.feature h3{font-size:1.08rem;text-transform:uppercase;margin-bottom:6px}
.feature p{color:var(--muted);font-size:.95rem}
.share{border-radius:22px;padding:40px 22px;text-align:center;background:linear-gradient(120deg,var(--red-d),var(--purple-d))}
.share .tag{font-size:clamp(1.6rem,6vw,2.6rem);font-weight:800;color:var(--yellow);word-break:break-word;margin:6px 0 10px}
.share p{max-width:560px;margin:0 auto;color:var(--white)}
.share .tags2{font-weight:700;color:var(--white);opacity:.85;margin:-4px 0 14px;word-break:break-word}
.share a{color:var(--yellow);font-weight:700;text-decoration:none}

/* ---------- ¿No participa? ---------- */
.join{background:var(--black)}
.split{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.panel{background:var(--ink);border:1px solid var(--line);border-radius:20px;padding:26px 22px;display:flex;flex-direction:column;gap:12px}
.panel .who{font-size:.75rem;color:var(--yellow)}
.panel h3{font-size:1.3rem;text-transform:uppercase}
.panel p{color:var(--muted);font-size:.96rem;flex:1}
.panel .btns{display:flex;flex-wrap:wrap;gap:10px}
.panel .btns .btn{flex:1 1 auto}

/* ---------- FAQ ---------- */
.faq .wrap{max-width:820px}
.faq details{border-bottom:1px solid var(--line);padding:18px 4px}
.faq summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--yellow);font-size:1.4rem;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq p{color:var(--muted);margin-top:10px;font-size:.96rem}

/* ---------- Footer ---------- */
footer{background:var(--black);padding:40px 0 48px;font-size:.88rem;color:var(--muted)}
footer .wrap{display:flex;flex-wrap:wrap;gap:22px;align-items:center;justify-content:space-between}
footer .pres{display:flex;align-items:center;gap:12px}
footer .pres img{height:34px;width:auto}
footer .links{display:flex;flex-wrap:wrap;gap:16px}
footer a{text-decoration:none}
footer a:hover{color:var(--yellow)}

/* ---------- Modal ---------- */
dialog{border:0;border-radius:22px;padding:0;max-width:440px;width:calc(100% - 32px);background:var(--ink);color:var(--white);box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.7)}
.modal{padding:26px 22px}
.modal h3{font-size:1.25rem;text-transform:uppercase;margin-bottom:4px}
.modal .hint{color:var(--muted);font-size:.9rem;margin-bottom:16px}
.msg{background:var(--white);color:#1b1b1a;border-radius:14px;padding:16px;font-size:1rem;line-height:1.5}
.msg + .msg{margin-top:10px;font-size:.9rem;opacity:.85}
.msg b{color:var(--red)}
.modal .row{display:flex;gap:10px;margin-top:18px}
.modal .row .btn{flex:1;padding:12px}

@media (max-width:560px){
  section{padding:54px 0}
  .ctas .btn{flex:1 1 100%}
  .hero{min-height:70svh}
}
@media (prefers-reduced-motion:reduce){.hero video,.city video{display:none}}
</style>
</head>

<script>
/* =========================================================
   CONFIGURACIÓN — revisar antes de publicar
   ========================================================= */
const CONFIG = {
  email:   "comercial@naturalezaencendida.com",        // email de adhesión de alojamientos
  hashtag: "#NaturalezaEncendida",                      // hashtag oficial (Instagram @naturaleza_encendida)
  cityTags: "#NaturalezaEncendidaSevilla · #NaturalezaEncendidaCórdoba",
  prices: { sev: 22, cor: 14 },
  fees:   { sev: 0,  cor: 2 },     // ← gastos de gestión de Fever por entrada (€)   // ← precio de la entrada Premium en Fever (€). Revisar si cambia.
  discount: 0.20,                  // 20 % con el código de huésped
  links: {                                              // enlaces de compra de la entrada Premium (Fever)
    sevPremium: "https://feverup.com/m/783873",
    corPremium: "https://feverup.com/m/776679?c=premium-tickets-cordoba"
  }
};

/* =========================================================
   TEXTOS · ES EN FR DE IT ZH JA
   ========================================================= */

const MSG_ES = e => `Hola, Naturaleza Encendida tiene un programa <b>gratuito</b> para alojamientos: sus huéspedes consiguen un 20 % de descuento en la entrada Premium. ¿Podríais uniros? Basta con escribir a <b>${e}</b>.`;
const MSG_EN = e => `Hi! Naturaleza Encendida has a <b>free</b> programme for accommodations: guests get 20% off the Premium ticket. Could you join? Just email <b>${e}</b>.`;

/* Email de adhesión (los alojamientos son españoles: siempre en español) */
const MAIL_SUBJECT = "Quiero ser alojamiento colaborador – Naturaleza Encendida";
const MAIL_BODY = "Hola,\n\nQueremos adherirnos como alojamiento colaborador de Naturaleza Encendida.\n\nNombre del alojamiento:\nTipo (hotel / hostel / apartamento / vivienda turística):\nCiudad (Sevilla / Córdoba):\nPersona de contacto:\nTeléfono:\n\nGracias.";

/* =========================================================
   LÓGICA
   ========================================================= */
const LANGS = Object.keys(T);
function detectLang(){
  const q = new URLSearchParams(location.search).get("lang");   // ?lang=de para los anuncios en alemán, etc.
  if (q && LANGS.includes(q)) return q;
  for (const l of (navigator.languages || [navigator.language || "es"])) {
    const c = (l || "").slice(0,2).toLowerCase();
    if (LANGS.includes(c)) return c;
  }
  return "en";
}
let lang = detectLang();
const sel = document.getElementById("langSel");

function render(){
  const t = T[lang];
  document.documentElement.lang = lang === "zh" ? "zh-Hans" : lang;
  sel.value = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const v = t[el.dataset.i18n]; if (typeof v === "string") el.textContent = v;
  });
  document.querySelectorAll("[data-link]").forEach(a => a.href = CONFIG.links[a.dataset.link]);
  document.querySelector(".js-hashtag").textContent = CONFIG.hashtag;
  document.querySelector(".js-citytags").textContent = CONFIG.cityTags;
  const loc = {es:"es-ES",en:"en-GB",fr:"fr-FR",de:"de-DE",it:"it-IT",zh:"zh-CN",ja:"ja-JP"}[lang];
  const fmt = n => new Intl.NumberFormat(loc,{style:"currency",currency:"EUR"}).format(n);
  document.querySelectorAll(".js-price").forEach(el => {
    const p = CONFIG.prices[el.dataset.city];
    const f = CONFIG.fees[el.dataset.city];
    el.innerHTML = t.priceTpl.replace("{p}", "<s>"+fmt(p)+"</s>").replace("{d}", fmt(Math.round(p*(1-CONFIG.discount)*100)/100))
      + (f ? '<br><small style="font-weight:500;opacity:.8">' + t.feeTpl.replace("{f}", fmt(f)) + '</small>' : '');
  });
  document.querySelector(".js-share").innerHTML = t.share.replace("{ig}", '<a href="https://www.instagram.com/naturaleza_encendida/" target="_blank" rel="noopener">@naturaleza_encendida</a>');
  document.querySelectorAll(".js-join").forEach(a => a.href = `mailto:${CONFIG.email}?subject=${encodeURIComponent(MAIL_SUBJECT)}&body=${encodeURIComponent(MAIL_BODY)}`);
  const em = document.querySelector(".js-email"); em.href = `mailto:${CONFIG.email}`; em.textContent = CONFIG.email;
  document.querySelector(".js-msg-es").innerHTML = MSG_ES(CONFIG.email);
  document.querySelector(".js-msg-en").innerHTML = MSG_EN(CONFIG.email);
}
sel.addEventListener("change", () => { lang = sel.value; render(); });

const dlg = document.getElementById("msgDialog");
document.getElementById("openMsg").addEventListener("click", () => dlg.showModal());
document.getElementById("closeMsg").addEventListener("click", () => dlg.close());
document.getElementById("copyMsg").addEventListener("click", async e => {
  const txt = document.querySelector(".js-msg-es").innerText + "\n\n" + document.querySelector(".js-msg-en").innerText;
  try { await navigator.clipboard.writeText(txt); e.target.textContent = T[lang].copied; setTimeout(render, 1500); } catch (_) {}
});
/* Vídeo de cabecera solo en ordenador (en móvil se queda la foto, para no gastar datos) */
(function(){
  const c = navigator.connection || {};
  if (window.innerWidth < 900 || c.saveData || /2g/.test(c.effectiveType || "")) return;
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const v = document.createElement("video");
  Object.assign(v, {muted:true, loop:true, autoplay:true, playsInline:true});
  v.setAttribute("aria-hidden","true");
  const s = document.createElement("source");
  s.src = "https://www.naturalezaencendida.com/wp-content/uploads/2026/09/Ne-Carmen-1440X460-1_qc38.webm"; s.type = "video/webm";
  v.appendChild(s);
  document.querySelector(".hero").prepend(v);
})();
render();
